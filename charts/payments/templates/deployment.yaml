{{- $svc := .Chart.Name -}}
{{- $rel := index .Values.release.services $svc | default dict -}}
{{- $version := $rel.version | default "0.0.0" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}
  labels:
    app.kubernetes.io/name: {{ $svc }}
    app.kubernetes.io/part-of: shopfront
    app.kubernetes.io/version: {{ $version | quote }}
    shopfront/tenant: {{ .Values.tenant.name }}
    shopfront/ring: {{ .Values.tenant.ring }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc }}
        app.kubernetes.io/version: {{ $version | quote }}
      annotations:
        shopfront/release: {{ .Values.release.name | quote }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - -listen=:8080
            - -text=service={{ $svc }} version={{ $version }} release={{ .Values.release.name }} tenant={{ .Values.tenant.name }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
